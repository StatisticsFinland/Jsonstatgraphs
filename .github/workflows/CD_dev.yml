name: Jsonstatgraphs CD (dev)

run-name: CD for ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows:
      - "Jsonstatgraphs CI"
    types:
      - completed
    branches:
      - dev

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/cd-publish.yml
    with:
      environment: dev
      npm-tag: dev
      prerelease-env: d
      prerelease: true
      staged-publish: false