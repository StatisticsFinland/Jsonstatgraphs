name: Jsonstatgraphs CD publish

on:
  workflow_call:
    inputs:
      npm-tag:
        description: npm dist-tag to publish
        required: true
        type: string
      prerelease:
        description: Whether to set a prerelease version before publishing
        required: true
        type: boolean
      environment:
        description: GitHub environment used for npm trusted publishing
        required: true
        type: string
      staged-publish:
        description: Whether to publish with npm provenance
        required: true
        type: boolean

jobs:
  publish:
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --no-audit --quiet --prefer-offline

    - name: Validate version bump
      run: npm run version-helper validate

    - name: Set prerelease version
      run: npm run version-helper setpreversion
      if: inputs.prerelease

    - name: Publish
      run: npm publish --tag ${{ inputs.npm-tag }} --git-tag-version false
      if: ${{ !inputs.staged-publish }}

    - name: Staged publish
      run: npm stage publish --tag ${{ inputs.npm-tag }} --git-tag-version false
      if: inputs.staged-publish